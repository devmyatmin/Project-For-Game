name: Copy Original Unity Materials
on:
  workflow_dispatch:
  push:
    branches:
      - work/stranded-deep-original
    paths:
      - .github/workflows/copy-original-materials.yml
permissions:
  contents: write
jobs:
  copy-original-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: work/stranded-deep-original
          fetch-depth: 0
      - name: Copy original Unity Material assets with cp
        shell: bash
        run: |
          set -euo pipefail
          SRC="VisualAssets/ExportedProject/Assets/Material"
          DEST="VisualAssets/OriginalMaterials/UnityMaterials"
          test -d "$SRC"
          mkdir -p "$DEST"
          cp -a "$SRC/." "$DEST/"
          echo "Source file count:"
          find "$SRC" -type f | wc -l
          echo "Copied file count:"
          find "$DEST" -type f | wc -l
          echo "Copied size:"
          du -sh "$DEST"
          echo "File extensions:"
          find "$DEST" -type f | sed 's/.*\.//' | sort | uniq -c
      - name: Commit copied files and sync branch safely
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="work/stranded-deep-original"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VisualAssets/OriginalMaterials/UnityMaterials
          if git diff --cached --quiet; then
            echo "No new copied files to commit."
            exit 0
          fi
          git commit -m "Copy original Unity Material assets"
          # The branch may advance after checkout while another workflow commits.
          # Rebase this material commit onto the latest remote head before pushing.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "Material files pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing branch and retrying."
          done
          echo "Could not push after 3 attempts."
          exit 1
