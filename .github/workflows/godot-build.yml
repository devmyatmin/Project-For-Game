name: Godot Android APK Export

on:
  workflow_dispatch:
  push:
    branches:
      - work/godot-apk-export
    paths-ignore:
      - '.github/workflows/godot-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK with Godot 4.7.2
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          cat > "$SETTINGS_DIR/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Download Godot 4.7.2 standard editor
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find "$PWD/godot-bin" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Could not find the Godot executable in the downloaded archive."
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O export_templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Verify Android export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Export Android test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          if ! timeout 600s "$GODOT_BIN" --headless --path . --export-debug "Android" build/StrandedDeep-test.apk --verbose 2>&1 | tee android-export.log; then
            echo "::error::Godot Android APK export failed."
            tail -n 120 android-export.log || true
            exit 1
          fi
          test -s build/StrandedDeep-test.apk
          ls -lh build/StrandedDeep-test.apk

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: stranded-deep-android-test
          path: build/StrandedDeep-test.apk
          if-no-files-found: error
          retention-days: 7
