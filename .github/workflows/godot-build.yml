name: Godot C# Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Godot 4.5.1 .NET project
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Java for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Download Godot 4.5.1 .NET
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip -O godot.zip
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin
          echo "Files extracted from Godot archive:"
          find godot-bin -maxdepth 2 -type f -printf '%p\\n'
          GODOT_BIN="$(find "$PWD/godot-bin" -type f -name 'Godot_v4.5.1-stable_mono_linux.x86_64' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Could not find the Godot executable in the downloaded archive."
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot .NET export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_export_templates.tpz -O export_templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.5.1.stable.mono"
          unzip -q export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable.mono/"

      - name: Import project and generate C# bindings
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Build C# project
        run: dotnet build StrandedDeep.csproj --configuration Debug

      - name: Export Android test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --install-android-build-template --export-debug "Android" build/StrandedDeep-test.apk

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: stranded-deep-android-test
          path: build/StrandedDeep-test.apk
          if-no-files-found: error
          retention-days: 7
