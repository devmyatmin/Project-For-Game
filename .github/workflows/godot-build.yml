name: Godot C# Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Godot 4.5.1 .NET project
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Godot 4.5.1 .NET
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.5.1-stable_mono_linux.x86_64
          mv godot-bin/Godot_v4.5.1-stable_mono_linux.x86_64 godot-bin/godot
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"

      - name: Import project and generate C# bindings
        run: godot --headless --editor --path . --quit

      - name: Build C# project
        run: dotnet build StrandedDeep.csproj --configuration Debug
