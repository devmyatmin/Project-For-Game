name: Decompile Original Stranded Deep DLLs

on:
  push:
    branches:
      - work/stranded-deep-original
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    name: Decompile and commit DLL source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download the two DLL inputs from Google Drive
        env:
          ASSEMBLY_CSHARP_ID: "1HITxCu9ZnMq0zOx0FG5blbg2l8YKykd6"
          FIRSTPASS_ID: "1tlsUjxYcJxzh_RDwaZ4oixU2QNDkanbE"
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          mkdir -p OriginalDLLs
          gdown "$ASSEMBLY_CSHARP_ID" -O OriginalDLLs/Assembly-CSharp.dll
          gdown "$FIRSTPASS_ID" -O OriginalDLLs/Assembly-CSharp-firstpass.dll
          test -s OriginalDLLs/Assembly-CSharp.dll
          test -s OriginalDLLs/Assembly-CSharp-firstpass.dll

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install ILSpyCmd
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspy-tools" --version 11.2.0.10050
          echo "$RUNNER_TEMP/ilspy-tools" >> "$GITHUB_PATH"

      - name: Decompile Assembly-CSharp.dll
        run: |
          set -euo pipefail
          mkdir -p DecompiledDLLs/Assembly-CSharp
          ilspycmd -p -o DecompiledDLLs/Assembly-CSharp OriginalDLLs/Assembly-CSharp.dll

      - name: Decompile Assembly-CSharp-firstpass.dll
        run: |
          set -euo pipefail
          mkdir -p DecompiledDLLs/Assembly-CSharp-firstpass
          ilspycmd -p -o DecompiledDLLs/Assembly-CSharp-firstpass OriginalDLLs/Assembly-CSharp-firstpass.dll

      - name: Commit decompiled source into this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DecompiledDLLs/
          if git diff --cached --quiet; then
            echo "No decompiled source changes to commit."
          else
            git commit -m "chore: decompile original Stranded Deep DLLs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
